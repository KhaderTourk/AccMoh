<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>لوحة المشروع</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* لوحة متابعة مشتركة بستايل أبل: خلفية رمادية فاتحة، بطاقات بيضا بدون حدود وظل خفيف، زوايا مدوّرة، وألوان المشروع للأزرار والتقدم.
   على الجوال القائمة بتصير شريط أفقي فوق */
:root {
  --bg: #f5f5f7; --panel: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --soft: #f2f2f4; --glass: rgb(245 245 247 / .78);
  --accent: #14212f; --accent-ink: #ffffff; --accent-soft: #e8eaee;
  --brand: #fb005b; --brand-ink: #ffffff; --brand-text: #c9004a;
  --done: #248a3d; --revise: #b25000; --urgent: #d70015; --doing: #0066cc; --waiting: #8944ab; --todo: #8e8e93;
  --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 16px rgb(0 0 0 / .05);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Arabic", "SF Arabic", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --panel: #1c1c1e; --ink: #f5f5f7; --muted: #98989d; --line: #38383a; --soft: #2c2c2e; --glass: rgb(0 0 0 / .72);
  --accent: #8db5a4; --accent-ink: #0f1a16; --accent-soft: #1f2a25;
  --brand: #ff6a33; --brand-ink: #ffffff; --brand-text: #ff8a5c;
  --done: #30d158; --revise: #ff9f0a; --urgent: #ff453a; --doing: #0a84ff; --waiting: #bf5af2; --todo: #8e8e93;
  --shadow: none;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --panel: #1c1c1e; --ink: #f5f5f7; --muted: #98989d; --line: #38383a; --soft: #2c2c2e; --glass: rgb(0 0 0 / .72);
  --accent: #8db5a4; --accent-ink: #0f1a16; --accent-soft: #1f2a25;
  --brand: #ff6a33; --brand-ink: #ffffff; --brand-text: #ff8a5c;
  --done: #30d158; --revise: #ff9f0a; --urgent: #ff453a; --doing: #0a84ff; --waiting: #bf5af2; --todo: #8e8e93;
  --shadow: none;
  color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; margin: 0; }
.wrap { direction: rtl; max-width: 1200px; margin: 0 auto; padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 2px; border-radius: 8px; }

/* الرأس: شريط زجاجي ثابت فوق */
.top { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-left, 0px)) 10px;
  background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.top h1 { font-size: 21px; font-weight: 700; }
.brandrow { display: flex; align-items: center; gap: 10px; }
.brandrow img { width: 36px; height: 36px; border-radius: 9px; flex: none; }
.histnav { display: inline-flex; gap: 4px; }
.histnav button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--soft); color: var(--ink); cursor: pointer; display: grid; place-items: center; font-size: 17px; line-height: 1; }
.histnav button:hover:not([disabled]) { background: var(--line); }
.histnav button[disabled] { opacity: .35; cursor: default; }
.who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.seg { display: inline-flex; background: color-mix(in srgb, var(--todo) 16%, transparent); border-radius: 9px; padding: 2px; gap: 0; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 4px 14px; cursor: pointer; font-size: 13px; color: var(--ink); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 3px rgb(0 0 0 / .12), 0 1px 1px rgb(0 0 0 / .04); font-weight: 600; }
#whoSeg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.mode { font-size: 12px; border-radius: 99px; padding: 2px 10px; background: var(--soft); color: var(--muted); }

.overall { background: var(--panel); border-radius: 18px; padding: 22px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.overall-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.overall-head .pct { font-size: 44px; font-weight: 700; letter-spacing: -.03em; color: var(--brand-text); line-height: 1; }
.overall-head .lbl { color: var(--muted); font-size: 15px; }
.stack { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--soft); gap: 2px; }
.stack span { display: block; height: 100%; border-radius: 99px; }
.stack.sm { height: 4px; gap: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--soft); border-radius: 99px; padding: 5px 13px 5px 11px; font-size: 13px; cursor: pointer; }
.chip:hover { background: var(--line); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sync { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--muted); }
.sync .live { color: var(--doing); font-weight: 600; }
.sync .btn[disabled] { opacity: .5; cursor: default; }
.next { display: grid; gap: 10px; background: var(--soft); border-radius: 14px; padding: 14px 16px; }
.nrow { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 4px 10px; align-items: start; }
.nwho { font-weight: 600; font-size: 13.5px; padding-top: 4px; }
.nitems { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.nitem { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--panel); border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; text-align: right; box-shadow: 0 0 0 1px var(--line); }
.nitem:hover { box-shadow: 0 0 0 1px var(--muted); }
.next b { color: var(--ink); white-space: nowrap; }
.next .nh { font-size: 15px; }

/* التخطيط */
.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; margin-top: 20px; align-items: start; }
.side { position: sticky; top: 76px; background: var(--panel); border-radius: 18px; padding: 8px; display: grid; gap: 1px; box-shadow: var(--shadow); }
.nav { display: grid; grid-template-columns: 24px 1fr auto; gap: 2px 8px; align-items: center; text-align: right; background: none; border: 0; border-radius: 10px; padding: 8px 10px; cursor: pointer; color: var(--ink); }
.nav:hover { background: var(--soft); }
.nav[aria-current="true"] { background: var(--brand); color: var(--brand-ink); }
.nav[aria-current="true"] .n, .nav[aria-current="true"] .p { color: inherit; opacity: .85; }
.nav .n { color: var(--muted); font-size: 12px; font-weight: 600; }
.nav .nm { font-weight: 500; font-size: 14px; }
.nav .p { color: var(--muted); font-size: 12px; }
.nav .stack { grid-column: 2 / 4; }
.nav .flag { width: 7px; height: 7px; border-radius: 50%; background: var(--urgent); display: inline-block; margin-inline-start: 6px; vertical-align: middle; }
.nav .badge { background: var(--urgent); color: #fff; border-radius: 99px; padding: 0 7px; font-size: 11.5px; font-weight: 700; min-width: 1.6em; text-align: center; }
.side hr { border: 0; border-top: 1px solid var(--line); margin: 6px 10px; }

main { display: grid; gap: 20px; min-width: 0; }
.card { background: var(--panel); border-radius: 18px; padding: 20px; min-width: 0; box-shadow: var(--shadow); }
.card-h { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-h h2 { font-size: 22px; font-weight: 700; }
.card-h h2 small { color: var(--muted); font-weight: 400; font-size: 14px; margin-inline-start: 8px; letter-spacing: 0; }

/* الجداول: صفوف بفواصل رفيعة زي قوائم أبل */
.tbl { display: grid; }
.trow { display: grid; grid-template-columns: 32px 6.5em minmax(0, 1fr) minmax(0, 1.5fr) 5.5em; gap: 4px 14px; align-items: center; padding: 11px 8px; border-bottom: 1px solid var(--line); }
.trow.irow { grid-template-columns: 32px 6.5em minmax(0, 2.4fr) 8.5em 6.5em; align-items: start; }
.trow.task-row { grid-template-columns: 8.5em minmax(0, 1fr) 9em 6.5em; }
.trow.task-row.wsec { grid-template-columns: 8.5em minmax(0, 1fr) 9em minmax(0, 11em) 6.5em; }
button.trow { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: right; cursor: pointer; color: var(--ink); border-radius: 0; }
.trow.thead { font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 0; padding-bottom: 8px; }
.trow.new .ttitle::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); margin-inline-end: 6px; vertical-align: middle; }
.trow.click { cursor: pointer; }
.trow.click:hover, button.trow:hover { background: var(--soft); }
.trow-wrap.open { background: var(--soft); border-radius: 12px; margin-block: 4px; }
.trow-wrap.open > button.trow { border-bottom-color: transparent; }
.tday { font-size: 13px; font-weight: 700; color: var(--ink); padding: 18px 8px 6px; }
.av { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; overflow: hidden; background: var(--accent); flex: none; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.tname { font-weight: 600; font-size: 13.5px; }
.ttitle { font-weight: 600; min-width: 0; }
.tdet, .tsec { color: var(--muted); font-size: 13.5px; min-width: 0; white-space: pre-wrap; }
.ttime { color: var(--muted); font-size: 12.5px; display: grid; gap: 4px; justify-items: start; }
.towner { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; min-width: 0; }
.towner .av { width: 24px; height: 24px; font-size: 11px; }
.ibody { display: grid; gap: 6px; min-width: 0; }
.ibody p { margin: 0; white-space: pre-wrap; }
.ilinks { display: flex; flex-wrap: wrap; gap: 6px; }
a.chip { text-decoration: none; color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 3px 11px; }
.ssel { border: 0; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); border-radius: 99px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; max-width: 100%; }
.xdel { color: var(--urgent) !important; font-size: 12.5px; padding: 0 !important; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); border-radius: 99px; padding: 2px 10px; white-space: nowrap; }

/* تفاصيل المهمة */
.det { padding: 4px 12px 14px; display: grid; gap: 12px; }
.det p { margin: 0; max-width: 70ch; white-space: pre-wrap; }
.det .row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.det a { font-weight: 600; }
.empty { color: var(--muted); font-size: 14px; padding: 8px; }
.cnote { display: grid; gap: 4px; background: var(--panel); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.cnote b { color: var(--accent); font-size: 12.5px; }
.cnote.pm b { color: var(--waiting); }
.ibody .cnote { background: var(--soft); }

/* التعديل */
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { border: 0; background: var(--panel); border-radius: 99px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; box-shadow: 0 0 0 1px var(--line); }
.quick button[aria-pressed="true"] { box-shadow: 0 0 0 1.5px var(--c); background: color-mix(in srgb, var(--c) 12%, var(--panel)); color: var(--c); font-weight: 600; }
.form { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.form .full { grid-column: 1 / 3; }
.form input, .form select, .form textarea, .next textarea, .next select { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 11px; width: 100%; box-sizing: border-box; color: var(--ink); }
.form textarea, .next textarea { min-height: 76px; resize: vertical; line-height: 1.6; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 0; background: var(--soft); border-radius: 99px; padding: 6px 16px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--ink); }
.btn:hover { background: var(--line); }
.det .btn:not(.pri), .ideabox .btn:not(.pri) { background: var(--panel); box-shadow: 0 0 0 1px var(--line); }
.btn.pri { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
.btn.pri:hover { background: color-mix(in srgb, var(--brand) 88%, #000); }
a.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
a.btn.pri { color: var(--brand-ink); }
.btn.danger { color: var(--urgent); }
.btn.link { background: none; color: var(--brand-text); padding: 2px 4px; font-weight: 600; }
.note { font-size: 12.5px; color: var(--muted); }
.err { font-size: 13px; color: var(--urgent); }

/* الأفكار */
.ideabox { display: grid; gap: 10px; }
.ideabox textarea { min-height: 96px; font-size: 16px; }
.ideabox textarea, .ideabox input[type=url] { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 12px; width: 100%; box-sizing: border-box; color: var(--ink); line-height: 1.6; }
.ideabox .row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ideabox .row2 input[type=url] { flex: 1 1 200px; min-width: 0; }
.ideabox .btn { padding: 8px 18px; font-size: 15px; }
.filepick { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
.filepick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.thumb { max-width: 220px; max-height: 220px; border-radius: 12px; display: block; }

.sec-head { display: grid; gap: 10px; }
.sec-head .k { color: var(--muted); font-size: 13px; }
.sec-head h2 { font-size: 28px; margin: 0; font-weight: 700; }
.sec-head .bar-row { display: flex; align-items: center; gap: 12px; }
.sec-head .bar-row .stack { flex: 1; }
.sec-head .pct { font-weight: 700; color: var(--brand-text); }

.gate { justify-self: start; border: 0; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--waiting); background: color-mix(in srgb, var(--waiting) 12%, transparent); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.banner { background: var(--panel); border-radius: 18px; padding: 28px 16px; text-align: center; color: var(--muted); box-shadow: var(--shadow); }

/* براند */
.credit { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12.5px; }
.credit b { color: var(--ink); font-weight: 700; }
.credit .by { display: inline-flex; align-items: center; gap: 8px; }
.credit .ver { border: 0; background: none; padding: 2px 6px; font: inherit; font-weight: 600; color: var(--muted); border-radius: 6px; }
.credit button.ver:not([disabled]) { cursor: pointer; color: var(--ink); }
.credit button.ver:not([disabled]):hover { background: var(--soft); }
.credit button.ver[disabled] { cursor: default; }

/* نافذة الإصدارات: بتنفتح من رقم الإصدار تحت، بصفحة القالب بس */
.reldlg { direction: rtl; border: 0; border-radius: 18px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: min(80vh, 720px); background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgb(0 0 0 / .25); font-family: var(--font); }
.reldlg::backdrop { background: rgb(0 0 0 / .35); }
.reldlg .dh { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.reldlg .dh h2 { font-size: 19px; }
.reldlg .dh h2 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-inline-start: 6px; }
.reldlg .x { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--soft); cursor: pointer; font-size: 16px; line-height: 1; color: var(--ink); }
.rel-list { list-style: none; margin: 0; padding: 4px 12px 12px; display: grid; }
.rel { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 4px 12px; padding: 14px 8px; border-bottom: 1px solid var(--line); }
.rel:last-child { border-bottom: 0; }
.rel-v { font-size: 20px; font-weight: 700; color: var(--brand-text); letter-spacing: -.01em; line-height: 1.3; }
.rel-v.minor { font-size: 16px; color: var(--muted); padding-inline-start: 6px; }
.rel-b { display: grid; gap: 6px; min-width: 0; }
.rel-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.rel-h b { font-weight: 600; }
.rel-h .note { white-space: nowrap; }
.rel ul { margin: 0; padding-inline-start: 1.2em; color: var(--muted); font-size: 13.5px; display: grid; gap: 2px; }
.credit .mark { width: 40px; height: 38px; object-fit: contain; background: #fff; border-radius: 10px; padding: 4px; box-shadow: var(--shadow); }

@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); margin-top: 14px; }
  .top { position: static; }
  .side { top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 5; display: flex; overflow-x: auto; gap: 4px; border-radius: 14px; scrollbar-width: none; }
  .side hr { display: none; }
  .nav { flex: none; grid-template-columns: auto auto; padding: 6px 12px; }
  .nav .p, .nav .stack { display: none; }
  .form { grid-template-columns: minmax(0, 1fr); }
  .form .full { grid-column: 1; }
  .overall { padding: 16px; }
  .overall-head .pct { font-size: 36px; }
  .card { padding: 16px; }
  .top h1 { font-size: 18px; }
  .trow, .trow.irow, .trow.task-row, .trow.task-row.wsec { grid-template-columns: 32px minmax(0, 1fr) auto; }
  .trow.thead { display: none; }
  .trow .ttitle, .trow .tdet, .trow .ibody { grid-column: 2 / 4; }
  .trow.irow .istat { grid-column: 2 / 3; }
  .trow.irow .ttime { grid-column: 3 / 4; justify-items: end; }
  .trow > .ttime { grid-row: 1; grid-column: 3 / 4; justify-items: end; white-space: nowrap; }
  .trow > .av { grid-row: 1; }
  .trow > .tname { grid-row: 1; grid-column: 2 / 3; }
  /* المهام على الجوال: الحالة والتاريخ فوق، المهمة، وتحتها على مين والقسم */
  .trow.task-row { grid-template-columns: minmax(0, 1fr) auto; }
  .trow.task-row > .tstat { grid-row: 1; grid-column: 1; }
  .trow.task-row > .ttime { grid-row: 1; grid-column: 2; }
  .trow.task-row > .ttitle { grid-column: 1 / 3; }
  .trow.task-row > .towner, .trow.task-row > .tsec { grid-column: 1 / 3; font-size: 12.5px; }
}
@media (prefers-reduced-motion: no-preference) { .stack span { transition: width .4s ease; } .btn, .nav, .chip, button.trow { transition: background-color .15s ease; } }
</style>

<div class="wrap" dir="rtl">
  <header class="top">
    <div class="brandrow">
      <img id="logo" src="" alt="" hidden>
      <h1 id="ttl">لوحة المشروع</h1>
    </div>
    <div class="who">
      <span class="mode" id="mode" hidden></span>
      <div class="seg" id="whoSeg" role="group" aria-label="عرض شغل مين"></div>

      if (x.link && /^https?:\/\//.test(x.link)) {
        var isGh = x.link.indexOf(IDEAS_GH) === 0;
        var a = el('a', 'chip', isGh ? 'التعليق على جيت هب ↗' : 'الرابط ↗'); a.href = x.link; a.target = '_blank'; a.rel = 'noopener'; a.title = x.link; links.appendChild(a);
      }
      if (links.childNodes.length) body.appendChild(links);
      if (x.note) { var nb = el('div', 'cnote'); nb.appendChild(el('b', '', 'ملاحظات Claude')); nb.appendChild(el('p', '', x.note)); body.appendChild(nb); }
      r.appendChild(body);
      var sc = el('div', 'istat');
      if (S.canWrite) {
        var sel = el('select', 'ssel'); sel.setAttribute('aria-label', 'حالة الفكرة'); sel.style.setProperty('--c', st.c);
        IORDER.forEach(function (k) { var op = el('option', '', IST[k].l); op.value = k; if (k === x.s) op.selected = true; sel.appendChild(op); });
        sel.addEventListener('change', function () { S.db.doc('ideas/' + x.id).update({ s: sel.value, updatedAt: new Date().toISOString() }).catch(function () {}); });
        sc.appendChild(sel);
      } else { var p = el('span', 'pill', st.l); p.style.setProperty('--c', st.c); sc.appendChild(p); }
      r.appendChild(sc);
      var tc = el('div', 'ttime');
      var tm = el('span', 'num', ago(x.at)); tc.appendChild(tm);
      if (S.canWrite) {
        if (!idel[x.id]) { var del = el('button', 'btn link xdel', 'احذف'); del.type = 'button'; del.addEventListener('click', function () { idel[x.id] = true; render(); }); tc.appendChild(del); }
        else {
          var yes = el('button', 'btn danger', 'احذف'); yes.type = 'button';
          yes.addEventListener('click', function () { S.db.doc('ideas/' + x.id).delete().then(function () { if (x.img && x.img.id && S.assets) S.assets.delete(x.img.id).catch(function () {}); }).catch(function () {}); });
          var no = el('button', 'btn', 'لا'); no.type = 'button'; no.addEventListener('click', function () { idel[x.id] = false; render(); });
          tc.appendChild(yes); tc.appendChild(no);
        }
      }
      r.appendChild(tc);
      tb.appendChild(r);
    });
    lc.appendChild(tb); main.appendChild(lc);
  }

  function viewMine() {
    var list = S.tasks.filter(function (t) { return !me || isMine(t, me); });
    var openL = list.filter(function (t) { return t.s !== 'done'; });
    var c = card(me ? 'مهام ' + me : 'كل المهام', openL.length + ' مفتوحة من ' + list.length);
    c.appendChild(taskList(openL, true)); main.appendChild(c);
    var d = list.filter(function (t) { return t.s === 'done'; });
    if (d.length) { var c2 = card('خلصت', d.length + ''); c2.appendChild(taskList(d, true)); main.appendChild(c2); }
  }
  function viewSection(s) {
    var list = secTasks(s.id);
    var c = el('section', 'card'), h = el('div', 'sec-head');
    h.appendChild(el('div', 'k', 'ثريد ' + s.num));
    h.appendChild(el('h2', '', s.name));
    h.appendChild(el('div', 'k', s.about));
    if (s.id === CFG.uiSec && CFG.brandKit && /^https:\/\//.test(CFG.brandKit)) { var bk = el('a', 'chip', 'ملفات الهوية: الشعار والألوان ↗'); bk.href = CFG.brandKit; bk.target = '_blank'; bk.rel = 'noopener'; var bkr = el('div', 'chips'); bkr.appendChild(bk); h.appendChild(bkr); }
    // بوابة الواجهات: كود الشاشات بيستنى موافقة الزبون
    var gate = CFG.uiGate && S.tasks.filter(function (t) { return t.id === CFG.uiGate; })[0];
    if (gate && gate.s !== 'done' && (CFG.gateSecs || []).indexOf(s.id) >= 0) { var gw = el('button', 'gate', 'الكود هون بيستنى موافقة الزبون على الواجهات ←'); gw.type = 'button'; gw.title = 'افتح قسم الواجهات'; gw.addEventListener('click', function () { go(SEC[CFG.uiSec] ? CFG.uiSec : ''); }); h.appendChild(gw); }
    var br = el('div', 'bar-row'); br.appendChild(stack(list)); br.appendChild(el('span', 'pct num', pct(list) + '٪')); h.appendChild(br);
    var ch = el('div', 'chips'), cc = counts(list);
    ORDER.forEach(function (k) { if (cc[k]) { var p = pill(k); p.textContent = ST[k].l + ' ' + cc[k]; ch.appendChild(p); } });
    h.appendChild(ch); c.appendChild(h); main.appendChild(c);
    var tl = card('المهام', 'اضغط على أي مهمة لتفاصيلها'); tl.appendChild(taskList(list, false));
    var add = addTaskBox(s.id); if (add) tl.appendChild(add);
    main.appendChild(tl);
  }
  function viewFilter(k) {
    var list = S.tasks.filter(function (t) { return t.s === k; });
    var c = card('كل المهام: ' + ST[k].l, list.length + ' مهمة'); c.appendChild(taskList(list, true)); main.appendChild(c);
  }

  function currentFilter() { var h = hist[hpos] || ''; return h.indexOf('f-') === 0 && ST[h.slice(2)] ? h.slice(2) : null; }
  // رجوع وتقديم داخل اللوحة: سجل خاص بالصفحة، والرابط بيتغيّر بدون ما يزيد على تاريخ المتصفح
  var hist = [location.hash.slice(1)], hpos = 0;
  function setHash(h) { try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) { location.hash = h; } }
  function go(h) {
    h = h || '';
    if (h !== hist[hpos]) { hist = hist.slice(0, hpos + 1); hist.push(h); hpos = hist.length - 1; setHash(h); }
    render(); window.scrollTo(0, 0);
  }
  function step(d) { var n = hpos + d; if (n < 0 || n >= hist.length) return; hpos = n; setHash(hist[n]); render(); }
  function renderHistBtns() {
    var b = document.getElementById('back'), f = document.getElementById('fwd');
    b.disabled = hpos <= 0; f.disabled = hpos >= hist.length - 1;
  }
  document.getElementById('back').addEventListener('click', function () { step(-1); });
  document.getElementById('fwd').addEventListener('click', function () { step(1); });

  var pending = false;
  function scheduleRender() {
    var a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') && main.contains(a) || (a && a.id === 'next-text')) { pending = true; return; }
    render();
  }
  document.addEventListener('focusout', function () { if (pending) setTimeout(function () { var a = document.activeElement; if (!(a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT'))) { pending = false; render(); } }, 0); });

  function render() {
    renderHead();
    var h = hist[hpos] || '', cur = 'mine';
    main.textContent = '';
    if (!S.loaded) { main.appendChild(el('div', 'banner', 'بتتحمّل المهام…')); renderSide(cur); return; }
    if (S.offline) {
      main.appendChild(el('div', 'banner', 'اللوحة ما قدرت توصل للتخزين المشترك. افتحها وإنت مسجّل دخول على كلود، وتأكد إن ' + CFG.pm + ' شاركها معك.'));
      renderSide(cur); return;
    }
    if (!S.tasks.length && !S.board && !S.demo) { main.appendChild(el('div', 'banner', 'لسا ما في مهام. اختار قسم من القائمة وزيد أول مهمة.')); }
    var f = currentFilter();
    if (SEC[h]) { cur = h; viewSection(SEC[h]); }
    else if (h === 'mine') { cur = 'mine'; viewMine(); }
    else if (h === 'log') { cur = 'log'; viewLog(); }
    else if (h === 'ideas') { cur = 'ideas'; viewIdeas(); }
    else if (f) { cur = null; viewFilter(f); }
    else { cur = 'mine'; viewMine(); }
    renderSide(cur); renderHistBtns();
    var ids = [];
    S.tasks.forEach(function (t) { if (t.updatedBy && names[t.updatedBy] == null) ids.push(t.updatedBy); });
    S.log.forEach(function (x) { if (x.by && names[x.by] == null) ids.push(x.by); });
    S.ideas.forEach(function (x) { if (x.by && names[x.by] == null) ids.push(x.by); });
    if (ids.length) resolveNames(ids.filter(function (v, i, a) { return a.indexOf(v) === i; }));
  }
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h !== hist[hpos]) { hist = hist.slice(0, hpos + 1); hist.push(h); hpos = hist.length - 1; } render(); });
  render();

  // ---------- الاتصال ----------
  function start() {
    if (!window.claude || !window.claude.use) { S.loaded = true; S.offline = true; render(); return; }
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      S.db = db; S.user = user;
      if (!db) { S.loaded = true; S.offline = true; render(); return; }
      var gotTasks = false, gotBoard = false;
      function ready() { if (gotTasks && gotBoard) { S.loaded = true; scheduleRender(); } }
      // المهام والإعدادات للمحررين بس؛ الأفكار لأي حدا بيقدر يكتب بالتخزين (المبرمج)، وقواعد التخزين بتمنعه عن الباقي
      Promise.all([user ? user.id() : null, user ? user.can('data.write') : null, user ? user.isOwner() : false, user ? user.canEdit() : false]).then(function (x) {
        S.myId = x[0];
        // التعديل والإضافة لصاحب اللوحة والمحررين بس؛ المبرمج بيشوف بس
        S.canWrite = !!x[3] || !!x[2];
        S.canIdea = S.canWrite;
        if (!x[2] && !me && !S.meSet) { me = CFG.dev; }
        S.isOwner = !!x[2];
        if (!me && x[2] && !S.meSet) { me = CFG.pm; }
        scheduleRender();
      });
      db.collection('tasks').onSnapshot(function (snap) {
        S.tasks = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
        gotTasks = true; ready(); if (S.loaded) scheduleRender();
      }, function () { S.loaded = true; S.offline = true; render(); });
      db.doc('board/refresh').onSnapshot(function (d) { S.refresh = d.exists ? d.data() : null; if (S.loaded) scheduleRender(); }, function () {});
      window.claude.use('mcp').then(function (m) { S.mcp = m; if (S.loaded) scheduleRender(); }, function () {});
      db.doc('board/main').onSnapshot(function (d) { S.board = d.exists ? d.data() : null; gotBoard = true; ready(); if (S.loaded) scheduleRender(); }, function () {});
      db.collection('ideas').orderBy('at', 'desc').limit(300).onSnapshot(function (snap) {
        S.ideas = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; }); if (S.loaded) scheduleRender();
      }, function () {});
      window.claude.use('assets').then(function (a) { S.assets = a; if (S.loaded) scheduleRender(); }, function () {});
      db.collection('log').orderBy('at', 'desc').limit(50).onSnapshot(function (snap) {
        S.log = snap.docs.map(function (d) { return d.data(); }); if (S.loaded) scheduleRender();
      }, function () {});
    });
  }
  // صفحة القالب بتعرض داتا تجريبية من tpl/demo.json بدل التخزين، للقراءة بس. الأوقات زي "-3h" يعني قبل 3 ساعات
  function rel(v) { return typeof v === 'string' && /^-\d+(\.\d+)?h$/.test(v) ? new Date(Date.now() - parseFloat(v.slice(1)) * 36e5).toISOString() : v; }
  function demo(d) {
    S.demo = true; S.loaded = true; S.canWrite = S.canIdea = false;
    if (d.project) document.getElementById('ttl').textContent = document.title = d.project;
    var lg = document.getElementById('logo'); lg.src = document.querySelector('.credit .mark').src; lg.alt = 'شعار شركة براند'; lg.hidden = false;
    S.tasks = (d.tasks || []).map(function (t) {
      ['updatedAt', 'ghSyncedAt'].forEach(function (k) { if (t[k]) t[k] = rel(t[k]); });
      if (t.date) t.date = rel(t.date).slice(0, 10);
      if (t.notes) t.notes.at = rel(t.notes.at); if (t.pmNote) t.pmNote.at = rel(t.pmNote.at);
      return t;
    });
    S.log = (d.log || []).map(function (x) { x.at = rel(x.at); return x; }).sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    S.ideas = (d.ideas || []).map(function (x) { x.at = rel(x.at); return x; });
    S.board = d.board || {}; if (S.board.sync) S.board.sync.lastRun = rel(S.board.sync.lastRun);
    render();
  }
  getJSON('tpl/demo.json').then(function (d) { if (d && d.tasks) demo(d); else start(); });
})();
</script>
